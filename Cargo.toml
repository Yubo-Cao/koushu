[workspace]
members = ["core", "src-tauri"]
resolver = "2"

[workspace.dependencies]
base64 = "0.22"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = "0.29"
