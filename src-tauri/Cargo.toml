[package]
name = "fun-asr-desktop"
version = "0.0.2"
description = "Linux-first desktop wrapper for Fun-ASR."
authors = ["Fun ASR Desktop Contributors"]
edition = "2021"

[lib]
name = "fun_asr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15"
dirs-next = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Push-to-talk on Wayland: XDG Portal GlobalShortcuts over D-Bus, with a
# direct evdev reader as the fallback when the portal refuses (it requires a
# non-empty app id, which an uninstalled dev build does not have).
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
evdev = "0.13"
# Anchor the voice bar as a real wlr-layer-shell panel. Version must track the
# gtk 0.18 that Tauri itself links, or there would be two incompatible GTKs.
# v0_6 gates is_supported() and set_keyboard_mode(); system lib is 0.10.
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# Push-to-talk on macOS: a CGEventTap gives both key edges and can run its own
# CFRunLoop on a dedicated thread, unlike NSEvent's global monitor which needs
# the main run loop. Requires Accessibility permission.
core-foundation = "0.10"
core-graphics = "0.24"
# Raw NSWindow messaging for the floating panel behaviour.
objc = "0.2"
